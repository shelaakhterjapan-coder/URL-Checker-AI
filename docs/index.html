<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Custom Browser — Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="tab-bar">
    <div id="tabs"></div>
    <button id="new-tab-btn">+</button>
  </div>

  <div id="nav-bar">
    <button id="back-btn">←</button>
    <button id="forward-btn">→</button>
    <button id="reload-btn">↻</button>
    <input id="url-bar" placeholder="Search or type URL" />
  </div>

  <div id="views-container" style="position:relative; flex:1;"></div>

  <script src="iframe-demo.js"></script>
</body>
</html>
