<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Custom Browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Tab Bar -->
  <div id="tab-bar">
    <div id="tabs"></div>
    <button id="new-tab-btn">+</button>
  </div>

  <!-- Navigation Controls & Address Bar -->
  <div id="nav-bar">
    <button id="back-btn">←</button>
    <button id="forward-btn">→</button>
    <button id="reload-btn">↻</button>
    <input type="text" id="url-bar" placeholder="Search or type URL" />
  </div>

  <script src="renderer.js"></script>
</body>
</html>
